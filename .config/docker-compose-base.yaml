services:
  grafana:
    user: root
    container_name: reductstore-datasource

    build:
      context: .
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-12.4.3}
        grafana_digest: ${GRAFANA_DIGEST:-sha256:c7516cc195e0c6fed177006156312cae0a90867274afe9373a45229ed20a7cf7}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - '3000:3000/tcp'
      - '2345:2345/tcp' # delve
    # extra_hosts:
    #   - 'host.docker.internal:host-gateway'
    security_opt:
      - 'apparmor:unconfined'
      - 'seccomp:unconfined'
    cap_add:
      - SYS_PTRACE
    volumes:
      - ../dist:/var/lib/grafana/plugins/reductstore-datasource
      - ../provisioning:/etc/grafana/provisioning
      - ..:/root/reductstore-datasource

    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.reductstore-datasource:debug
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: reductstore-datasource
