# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    outputs:
      archive: ${{ steps.metadata.outputs.archive }}
      plugin-id: ${{ steps.metadata.outputs.plugin-id }}
      plugin-version: ${{ steps.metadata.outputs.plugin-version }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Go environment
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '^1.24.11'

      - name: Build backend
        uses: magefile/mage-action@a662bd8c29d8106879588cfff83b2faf6e6f59db # v4.0.0
        with:
          version: latest
          args: buildAll

      - name: Resolve plugin metadata
        id: metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          PLUGIN_ID="$(jq -r '.id' dist/plugin.json)"
          PLUGIN_VERSION="$(jq -r '.info.version' dist/plugin.json)"
          ARCHIVE="${PLUGIN_ID}-${PLUGIN_VERSION}.zip"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "plugin-id=${PLUGIN_ID}" >> "$GITHUB_OUTPUT"
          echo "plugin-version=${PLUGIN_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package plugin
        run: |
          mv dist "${PLUGIN_ID}"
          zip "${ARCHIVE}" "${PLUGIN_ID}" -r
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
          PLUGIN_ID: ${{ steps.metadata.outputs.plugin-id }}
          PLUGIN_VERSION: ${{ steps.metadata.outputs.plugin-version }}

      - name: Upload plugin archive to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: ${{ steps.metadata.outputs.archive }}

      - name: Prepare Docker plugin artifact
        run: |
          mkdir -p docker-artifact/dist/${{ steps.metadata.outputs.plugin-id }}
          cp -R ${{ steps.metadata.outputs.plugin-id }}/. docker-artifact/dist/${{ steps.metadata.outputs.plugin-id }}/

      - name: Upload Docker plugin artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-plugin-${{ steps.metadata.outputs.plugin-version }}
          path: docker-artifact/dist
          retention-days: 7

  publish-docker:
    name: Publish Docker image
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download built plugin artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-plugin-${{ needs.release.outputs.plugin-version }}
          path: dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Resolve version tags
        id: versions
        run: |
          GRAFANA_VERSION="$(sed -n 's/^FROM .*grafana:\([^[:space:]]*\)$/\1/p' Dockerfile | head -n 1)"
          PLUGIN_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "${GRAFANA_VERSION}" ]; then
            echo "Cannot parse Grafana version from Dockerfile" >&2
            exit 1
          fi
          echo "grafana_version=${GRAFANA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "plugin_version=${PLUGIN_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: docker.io/reduct/grafana
          tags: |
            type=raw,value=plugin-${{ steps.versions.outputs.plugin_version }}-grafana-${{ steps.versions.outputs.grafana_version }}
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build image for sanity test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: reduct/grafana:release-sanity

      - name: Sanity test image startup and plugin loading
        run: |
          set -euo pipefail

          cid=""
          cleanup() {
            if [ -n "${cid}" ]; then
              docker logs "${cid}" || true
              docker rm -f "${cid}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          cid=$(docker run -d -p 13000:3000 reduct/grafana:release-sanity)

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:13000/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:13000/api/health
          curl -fsS -u admin:admin http://127.0.0.1:13000/api/plugins/reductstore-datasource/settings | grep -q '"id":"reductstore-datasource"'

          if docker logs "${cid}" 2>&1 | grep -q "Could not start plugin backend"; then
            echo "Plugin backend startup failed"
            exit 1
          fi

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
