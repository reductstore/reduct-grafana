services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
  reductstore:
    image: docker.io/reduct/store@sha256:d2a38094151dce0ece1d66610ee015892f9b650d81ee1237b230bc1335208164
    ports:
      - '8383:8383'
    environment:
      - RS_API_TOKEN=${RS_API_TOKEN:-dev-token}
      - RS_LICENSE_PATH=/reduct.lic
      - RS_CORS_ALLOW_ORIGIN=*
    volumes:
      - reductstore-data:/data
      - ~/data/reduct.lic:/reduct.lic:ro

volumes:
  reductstore-data:
